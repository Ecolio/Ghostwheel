<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="titre desc">
  <title id="titre">Cornelius</title>
  <desc id="desc">L’orbe de Cornelius, entourée de cartes météo, transports et heure, sur un miroir noir.</desc>
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1312" />
      <stop offset="1" stop-color="#030605" />
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38b4a0" stop-opacity="0.55" />
      <stop offset="0.55" stop-color="#38b4a0" stop-opacity="0.12" />
      <stop offset="1" stop-color="#38b4a0" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbe" cx="0.42" cy="0.34" r="0.72">
      <stop offset="0" stop-color="#e4fbf5" />
      <stop offset="0.28" stop-color="#9fe6d8" />
      <stop offset="0.62" stop-color="#3fb7a3" />
      <stop offset="1" stop-color="#0f4f45" />
    </radialGradient>
    <linearGradient id="irise" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc4ff" />
      <stop offset="0.35" stop-color="#b39dff" />
      <stop offset="0.65" stop-color="#ff8f7a" />
      <stop offset="1" stop-color="#9fe0c0" />
    </linearGradient>
    <linearGradient id="carte" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <filter id="flou" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#fond)" />
  <rect x="14" y="14" width="1252" height="392" rx="20" fill="none" stroke="#dbe9c9" stroke-opacity="0.08" />

  <!-- Poussière lumineuse -->
  <g fill="#c6f2e7">
    <circle cx="120" cy="70" r="1.4" opacity="0.5" />
    <circle cx="300" cy="350" r="1.1" opacity="0.4" />
    <circle cx="560" cy="60" r="1.2" opacity="0.35" />
    <circle cx="1180" cy="90" r="1.5" opacity="0.45" />
    <circle cx="1090" cy="360" r="1.1" opacity="0.4" />
    <circle cx="760" cy="380" r="1.3" opacity="0.3" />
  </g>

  <!-- Orbe -->
  <g transform="translate(330 210)">
    <circle r="190" fill="url(#halo)" />
    <circle r="112" fill="none" stroke="url(#irise)" stroke-width="6" opacity="0.55" filter="url(#flou)" />
    <circle r="104" fill="url(#orbe)" />
    <circle r="104" fill="none" stroke="url(#irise)" stroke-width="1.6" opacity="0.7" />
    <ellipse cx="-22" cy="-52" rx="52" ry="22" fill="#ffffff" opacity="0.28" />
    <ellipse cx="36" cy="58" rx="30" ry="9" fill="#ffffff" opacity="0.08" />
  </g>

  <!-- Titre -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="560" y="182" font-size="86" font-weight="600" fill="#f2efe8" letter-spacing="2">Cornelius</text>
    <text x="563" y="230" font-size="26" fill="#9baba2">Le miroir intelligent de la famille, en français</text>
    <text x="563" y="266" font-size="19" fill="#6fd1bf" letter-spacing="1.5">VOIX · VISAGES · MAISON · LOCAL D’ABORD</text>
  </g>

  <!-- Cartes du miroir -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <g transform="translate(563 300)">
      <rect width="182" height="64" rx="14" fill="url(#carte)" stroke="#7cc4ff" stroke-opacity="0.45" />
      <circle cx="30" cy="32" r="11" fill="#7cc4ff" opacity="0.85" />
      <text x="52" y="28" font-size="13" fill="#9baba2">Météo</text>
      <text x="52" y="48" font-size="18" fill="#f2efe8">21° · ensoleillé</text>
    </g>
    <g transform="translate(761 300)">
      <rect width="182" height="64" rx="14" fill="url(#carte)" stroke="#ffb35c" stroke-opacity="0.45" />
      <rect x="20" y="22" width="20" height="20" rx="5" fill="#ffb35c" opacity="0.85" />
      <text x="52" y="28" font-size="13" fill="#9baba2">Bus 72</text>
      <text x="52" y="48" font-size="18" fill="#f2efe8">dans 3 min</text>
    </g>
    <g transform="translate(959 300)">
      <rect width="182" height="64" rx="14" fill="url(#carte)" stroke="#dfe6ee" stroke-opacity="0.35" />
      <circle cx="30" cy="32" r="11" fill="none" stroke="#dfe6ee" stroke-width="2" />
      <path d="M30 25 V32 L35 35" stroke="#dfe6ee" stroke-width="2" fill="none" stroke-linecap="round" />
      <text x="52" y="28" font-size="13" fill="#9baba2">Mardi</text>
      <text x="52" y="48" font-size="18" fill="#f2efe8">12:34</text>
    </g>
  </g>
</svg>
